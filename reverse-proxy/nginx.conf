# Reverse proxy davanti a frontend+backend: un solo ingresso pubblico (porta 80)
# invece di due porte separate — necessario per esporre l'app con un singolo
# tunnel/indirizzo (issue #78).
#
# Instradamento per prefisso di path: i prefissi delle rotte del backend
# (da [Route("[controller]")] nei Controller) vanno al backend, tutto il
# resto (SPA React + asset statici) va al frontend.

server {
	listen 80;

	location ~ ^/(auth|user|employee|shift|push|settings|swaprequest)(/|$) {
		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# SignalR (AppHub): richiede l'upgrade a websocket, non solo request/response.
	location /hubs/ {
		proxy_pass http://backend:8080;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 3600s;
	}

	location / {
		proxy_pass http://frontend:80;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}
}
