name: Five68-CI

# only pull_request: jobs run on each PR open/update to main, but NOT after
# merge (avoiding re-executing same pipeline wasting time)
# The trigger "push: branches: [main]" will be added only with future CD/tagging jobs

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        working-directory: backend
        run: dotnet format Five68Platform.slnx --verify-no-changs

      - name: Build solution (analyzer warnings visible in log)
        working-directory: backend
        run: dotnet build Five68Platform.slnx

      - name: Build image
        run: docker compose build backend

      - name: Unit tests
        run: docker compose run unit-tests

      - name: Integration tests
        run: docker compose run integration-tests

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build image
        run: docker compose build frontend

